
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - BCA Department</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>BCA Department</h1>
        <p>Student Record Management System</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="register.html">New Registration</a>
        <a href="search.html">Search Student</a>
    </nav>

    <main>
        <section>
            <h2>New Student Registration</h2>
            <p>Enter student details below to register a new student.</p>

            <form id="studentForm">

                <label for="roll">Roll Number:</label>
                <input type="text" id="roll" required>

                <label for="name">Student Name:</label>
                <input type="text" id="name" required>

                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" required>

                <label for="gender">Gender:</label>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>

                <label for="email">Email:</label>
                <input type="email" id="email" required>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" required>

                <label for="address">Address:</label>
                <textarea id="address" rows="3" required></textarea>

                <label for="course">Course:</label>
                <input type="text" id="course" value="BCA" required>

                <label for="semester">Semester:</label>
                <select id="semester" required>
                    <option value="">Select Semester</option>
                    <option value="1">1st Semester</option>
                    <option value="2">2nd Semester</option>
                    <option value="3">3rd Semester</option>
                    <option value="4">4th Semester</option>
                    <option value="5">5th Semester</option>
                    <option value="6">6th Semester</option>
                </select>

                <label for="admission">Admission Date:</label>
                <input type="date" id="admission" required>

                <label for="father">Father/Guardian Name:</label>
                <input type="text" id="father" required>

                <label for="photo">Student Photo:</label>
                <input type="file" id="photo" accept="image/*">

                <button type="submit">Register Student</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 BCA Department Student Record Management System</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
